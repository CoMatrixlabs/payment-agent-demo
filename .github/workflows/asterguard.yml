name: AsterGuard gate

# Runs the AsterGuard data-agent gate on every PR: scans the change, attacks the
# reference agent, proves the data boundary, and returns Ship / Review / Block as a
# sticky PR comment. Block fails the check.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7 (pinned)
        with:
          fetch-depth: 0
      - name: AsterGuard data-agent gate
        uses: CoMatrixlabs/asterguard/mcp-gateway@main
        with:
          mcp-url: ${{ vars.ASTERGUARD_MCP_URL }}
          token: ${{ secrets.ASTERGUARD_TOKEN }}
          app: payment-agent-demo
          scan-mode: standard
          fail-on: block
